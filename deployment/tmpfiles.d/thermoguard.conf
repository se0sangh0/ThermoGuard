# Root-provisioned, volatile dashboard lock.
#
# Install as /etc/tmpfiles.d/thermoguard.conf, then run
# `systemd-tmpfiles --create /etc/tmpfiles.d/thermoguard.conf` before the first
# dashboard launch.  The dashboard user needs only group-read access to the
# file in order to hold an exclusive flock; it must not be able to delete or
# replace the lock file.
d /run/thermoguard 0750 root thermoguard -
f /run/thermoguard/dashboard.lock 0640 root thermoguard -
